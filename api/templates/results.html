<div class="mb-8 text-center border-b pb-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-600">Reference Image:</h2>
    <img src="{{ uploaded_image }}" alt="Uploaded"
         class="h-40 object-cover rounded-lg shadow-md mx-auto border-2 border-indigo-200">
</div>

<h2 class="text-2xl font-bold mb-6 text-gray-800">Top 5 Visually Similar Matches</h2>
{% if matches %}
<div class="grid grid-cols-1 md:grid-cols-5 gap-4">
    {% for match in matches %}
    <div class="bg-white border border-gray-200 rounded-lg p-3 shadow hover:shadow-lg transition">
        <img src="{{ match.path }}" alt="Product"
             class="w-full h-40 object-contain mb-3 bg-gray-50 rounded">
        <p class="font-bold text-gray-800 text-sm">ID: {{ match.id }}</p>
        <p class="text-xs text-gray-600 mt-1">
            <span class="font-semibold">Category:</span> {{ match.category }}
        </p>
        <p class="text-xs text-gray-600">
            <span class="font-semibold">Type:</span> {{ match.subcategory }}
        </p>
        <div class="mt-3 bg-indigo-50 p-2 rounded text-center">
            <p class="text-xs text-indigo-700 font-semibold">Distance: {{ match.distance }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-center text-gray-500">No similar products were found.</p>
{% endif %}
